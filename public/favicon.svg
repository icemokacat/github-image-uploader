<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#24292e"/>

  <!-- Image icon (mountain/landscape) -->
  <g transform="translate(50, 50)">
    <!-- Photo frame -->
    <rect x="-25" y="-20" width="50" height="35" rx="3" fill="#fff" stroke="#667eea" stroke-width="2"/>

    <!-- Mountain/landscape inside -->
    <path d="M -20 5 L -10 -5 L 0 5 L 10 -10 L 20 5 L 20 10 L -20 10 Z" fill="#667eea"/>

    <!-- Sun/moon -->
    <circle cx="-12" cy="-8" r="4" fill="#ffd700"/>

    <!-- Upload arrow -->
    <g transform="translate(0, 22)">
      <circle cx="0" cy="0" r="12" fill="#28a745"/>
      <path d="M 0 -6 L 0 6 M 0 -6 L -4 -2 M 0 -6 L 4 -2" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
